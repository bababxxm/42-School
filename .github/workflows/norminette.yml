name: 42 Norminette CI

on:
  push:
    branches: [ main ]
    paths:
      - '**.c'
      - '**.h'
  pull_request:
    branches: [ main ]
    paths:
      - '**.c'
      - '**.h'
  workflow_dispatch:
    inputs:
      target_dir:
        description: 'Specific directory to check (leave empty for changed files)'
        required: false
        default: ''

jobs:
  norminette:
    name: Check Norm Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Norminette
        run: |
          python -m pip install --upgrade pip
          pip install norminette

      - name: Verify Norminette Version
        run: norminette -v

      - name: Run Norminette on Changed Files
        if: "${{ github.event.inputs.target_dir == '' }}"
        run: |
          echo "Detecting modified C and header files..."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(c|h)$' || true)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '\.(c|h)$' || true)
          fi

          if [ -z "$FILES" ]; then
            echo "No C/header files modified. Skipping."
            exit 0
          fi

          echo "Checking files:"
          echo "$FILES"
          norminette $FILES

      - name: Run Norminette on Specific Directory
        if: "${{ github.event.inputs.target_dir != '' }}"
        run: |
          echo "Running norminette on: ${{ github.event.inputs.target_dir }}"
          norminette ${{ github.event.inputs.target_dir }}
